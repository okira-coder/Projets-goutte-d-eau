[project]
name = "projet-goutte-eau"
version = "0.1.0"
description = "MVP de prévision de pluie pour l'Occitanie"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "pymysql>=1.1",
  "cryptography>=42",
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "xgboost>=2.1",
  "joblib>=1.4",
  "matplotlib>=3.9",
  "seaborn>=0.13",
  "httpx>=0.27",
  "tenacity>=8.5",
  "streamlit>=1.36",
  "python-dotenv>=1.0",
  "codecarbon>=2.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "black>=24.4",
  "mypy>=1.10",
  "jupyter>=1.0",
  "ipykernel>=6.29",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"
